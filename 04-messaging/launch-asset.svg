<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="1080" height="1350" fill="#07162C"/>
  <circle cx="930" cy="170" r="260" fill="#0E2447"/>
  <text x="90" y="170" fill="#93B4E8" font-size="34" font-weight="600">Roamly Groups</text>
  <text x="90" y="300" fill="#FFFFFF" font-size="96" font-weight="800" letter-spacing="-2">Book together.</text>
  <text x="90" y="410" fill="#FFFFFF" font-size="96" font-weight="800" letter-spacing="-2">Pay separately.</text>
  <text x="90" y="490" fill="#C7D2E3" font-size="38">Nobody's the bank.</text>

  <rect x="90" y="570" width="900" height="560" rx="36" fill="#0F2240" stroke="#1F3A66" stroke-width="2"/>
  <text x="140" y="650" fill="#FFFFFF" font-size="42" font-weight="700">Lisbon house, 6 friends</text>
  <text x="140" y="705" fill="#93A4BF" font-size="30">Total €1,284  |  each share €214</text>

  <g transform="translate(140,760)">
    <rect x="0"   y="0" width="128" height="64" rx="12" fill="#3B82F6"/>
    <rect x="136" y="0" width="128" height="64" rx="12" fill="#3B82F6"/>
    <rect x="272" y="0" width="128" height="64" rx="12" fill="#3B82F6"/>
    <rect x="408" y="0" width="128" height="64" rx="12" fill="#3B82F6"/>
    <rect x="544" y="0" width="128" height="64" rx="12" fill="#3B82F6"/>
    <rect x="680" y="0" width="120" height="64" rx="12" fill="none" stroke="#3B82F6" stroke-width="4" stroke-dasharray="10 8"/>
    <g fill="#FFFFFF" font-size="26" font-weight="600" text-anchor="middle">
      <text x="64" y="42">Maya</text><text x="200" y="42">Jon</text><text x="336" y="42">Ana</text>
      <text x="472" y="42">Leo</text><text x="608" y="42">Sam</text>
    </g>
    <text x="740" y="42" fill="#93B4E8" font-size="26" font-weight="600" text-anchor="middle">Kai</text>
  </g>
  <text x="140" y="900" fill="#FFFFFF" font-size="34" font-weight="600">5 of 6 paid</text>
  <text x="140" y="950" fill="#93A4BF" font-size="30">Kai is late? The booking still holds.</text>
  <text x="140" y="995" fill="#93A4BF" font-size="30">Re-split the gap or cover it. Your call.</text>
  <rect x="140" y="1035" width="800" height="4" rx="2" fill="#1F3A66"/>
  <text x="140" y="1090" fill="#C7D2E3" font-size="28">Friends pay from a link. No app needed.</text>

  <rect x="90" y="1180" width="480" height="96" rx="48" fill="#3B82F6"/>
  <text x="330" y="1240" fill="#FFFFFF" font-size="36" font-weight="700" text-anchor="middle">Start a Group</text>
</svg>
